name: Auto Build & Publish

# 上游 denoland/std 发新版本时**没法通知本仓库**（GitHub 不支持跨仓库 release 事件，
# 除非上游配 webhook + PAT），所以用「每日 cron 轮询 + 手动 workflow_dispatch」发现新 tag：
#   - 发现新 tag → 重建整合包（std/ + deno.json）+ 刷新 $std 技能生成物 → 提交、打 tag、发版、发布到 JSR
#   - 没有新 tag → refresh-skill 作业仍会把技能生成物对齐到最新上游 tag（只有真有变化才提交）
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*" # 支持你手动推送 v* 的 tag 时直接触发发布

jobs:
  check-and-build:
    name: Check & Build Deno Std
    # 只有定时任务或手动点击 workflow_dispatch 时才跑构建任务。
    # 这样可以防止手动 push tag 时重复跑 build 导致死循环。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      SKIP: ${{ steps.check-version.outputs.SKIP }}
      # publish 作业必须检出「刚 bump 完的提交」，所以把新版本 tag 传下去
      VER: ${{ steps.bump.outputs.my_ver }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Get latest denoland/std release
        id: get-latest-std
        run: |
          STD_TAG=$(curl -s https://api.github.com/repos/denoland/std/releases/latest | jq -r .tag_name)
          echo "STD_TAG=$STD_TAG" >> $GITHUB_ENV
          echo "STD_TAG=$STD_TAG" >> $GITHUB_OUTPUT

      - name: Check if already built for this version
        id: check-version
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ github.repository }}/git/refs/tags/std-${{ env.STD_TAG }})
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version ${{ env.STD_TAG }} already built. Skipping."
            echo "SKIP=true" >> $GITHUB_OUTPUT
          else
            echo "New version detected: ${{ env.STD_TAG }}. Proceeding to build."
            echo "SKIP=false" >> $GITHUB_OUTPUT
          fi

      # 先升级版本号：build.ts 会把 deno.json 的其它字段原样保留，
      # 而技能生成物里的版本号（"@g9wp/std x.y.z 的 exports 清单"）也要取到升完后的值，
      # 所以必须在 build / gen 之前 bump。
      - name: Bump version
        id: bump
        if: steps.check-version.outputs.SKIP == 'false'
        run: |
          VER=v$(deno bump-version patch)
          echo "my_ver=$VER" >> $GITHUB_OUTPUT
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Run Build Script
        if: steps.check-version.outputs.SKIP == 'false'
        run: |
          deno run -A --no-config build.ts --repo_path=./deno_std

      # 刷新 $std 技能（.dsh/skills/std/references/*）。
      # 两种情况都跑：
      #   - 有新 tag：build.ts 已把上游 clone 在 ./deno_std，直接用
      #   - 没有新 tag：自己拉一个浅 clone（只为了拿 tag 与源码），用于把技能生成物
      #     对齐到当前上游版本（改了 gen.ts / SKILL.md 后生成物过期时也能自动补上）
      # 生成物里只写仓库 URL；上游 ref 由 gen.ts 从该 clone 的 git tag 自动检测。
      - name: Regenerate $std skill references
        run: |
          if [ ! -d ./deno_std/.git ]; then
            git clone --depth 1 --branch "$STD_TAG" https://github.com/denoland/std.git ./deno_std \
              || git clone --depth 1 https://github.com/denoland/std.git ./deno_std
          fi
          STD_UPSTREAM_REPO=./deno_std deno run -A --no-config .dsh/skills/std/scripts/gen.ts
          echo "--- 技能生成物变更（无输出=已是最新）---"
          git diff --stat -- .dsh/skills/std/references || true

      # 没有新上游版本时，技能生成物若确有变化（例如改了 gen.ts / SKILL.md），
      # 单独提交一次；有新版本时由下面的提交步骤连同整合包一起提交。
      - name: Commit skill-only refresh
        if: steps.check-version.outputs.SKIP == 'true'
        run: |
          if [ -z "$(git status --porcelain -- .dsh/skills/std)" ]; then
            echo "技能生成物已是最新，无需提交"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .dsh/skills/std
          git commit -m "skill: 刷新 \$std 速查生成物（上游 $STD_TAG）"
          git push origin HEAD

      - name: Commit, Tag and Push
        id: git-tasks
        if: steps.check-version.outputs.SKIP == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "std_tag=std-$STD_TAG" >> $GITHUB_OUTPUT

          git add -u
          # 整合包与技能（含新增/删除的模块文件）一起提交
          git add -A -- std .dsh/skills/std
          git commit -m "std $STD_TAG"
          git push origin HEAD
          git tag "std-$STD_TAG"
          git push origin "std-$STD_TAG"
          git tag "$VER"
          git push origin "$VER"

      - name: Create GitHub Release
        if: steps.check-version.outputs.SKIP == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          name: "${{ env.VER }} ${{ env.STD_TAG }}"
          body: |
            Automatically compiled from [denoland/std@${{ env.STD_TAG }}](https://github.com/denoland/std/releases/tag/${{ env.STD_TAG }})

  publish:
    name: Publish to JSR/Deno
    # 触发逻辑：
    # 1. 手动 push tag 'v*' → 直接发布该 tag
    # 2. 手动 workflow_dispatch → 发布当前分支 deno.json 里的版本（用于补发失败/漏发的版本）
    # 3. 每日任务 → 必须等 check-and-build 成功且确实构建了新版本（SKIP=false）才发布
    needs: check-and-build
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.check-and-build.result == 'success' && needs.check-and-build.outputs.SKIP == 'false'))
    runs-on: ubuntu-latest

    permissions:
      id-token: write # JSR / Deno Publish 鉴权必需
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          # 定时 / workflow_dispatch 触发的 run，github.sha 固定在 run 创建那一刻，
          # 此时 check-and-build 还没有 push bump 提交；不写 ref 就会检出旧提交（旧版本号），
          # deno publish 只会打印 "Skipping, already published" 并成功退出 —— 什么都没发出去。
          # 所以优先检出 build 作业刚打的新版本 tag，没有（tag 触发 / 手动补发）时用当前 ref。
          ref: ${{ needs.check-and-build.outputs.VER || github.ref_name }}
          fetch-depth: 0

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish
        run: deno publish

      # deno publish 对「已发布过的版本」只警告不报错，静默跳过会让 CI 全绿却什么都没发。
      # 这里回查 JSR，确认本次检出的版本真的在 registry 上。
      - name: Verify version is on JSR
        run: |
          VERSION=$(jq -r .version deno.json)
          echo "本次检出提交的版本：$VERSION"
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://jsr.io/@g9wp/std/meta.json | jq -e --arg v "$VERSION" '.versions[$v]' > /dev/null; then
              echo "✅ @g9wp/std@$VERSION 已发布到 JSR"
              exit 0
            fi
            sleep 5
          done
          echo "::error::@g9wp/std@$VERSION 不在 JSR 上：publish 被静默跳过，通常是检出了旧提交（检查 checkout 的 ref）"
          exit 1
